anghai","sh5","#944d9a","#fff"]},"reconcileId":"","parallelIndex":-1}},{"key":"line_IWn92PBgnx","source":"stn_7q2kkwU58J","target":"stn_HD-UodmMUv","attributes":{"visible":true,"zIndex":0,"type":"diagonal","diagonal":{"startFrom":"from","offsetFrom":0,"offsetTo":0,"roundCornerFactor":10},"style":"single-color","single-color":{"color":["wuhan","wh2","#EB7CAF","#fff"]},"reconcileId":"","parallelIndex":-1}},{"key":"line_DhmvIK-P5c","source":"stn_HD-UodmMUv","target":"stn_UkCOaODwNq","attributes":{"visible":true,"zIndex":0,"type":"diagonal","diagonal":{"startFrom":"from","offsetFrom":0,"offsetTo":0,"roundCornerFactor":10},"style":"single-color","single-color":{"color":["wuhan","wh2","#EB7CAF","#fff"]},"reconcileId":"","parallelIndex":-1}},{"key":"line_0yunwY11ec","source":"stn_1ketgotRf8","target":"stn_7q2kkwU58J","attributes":{"visible":true,"zIndex":0,"type":"diagonal","diagonal":{"startFrom":"from","offsetFrom":0,"offsetTo":0,"roundCornerFactor":10},"style":"single-color","single-color":{"color":["wuhan","wh2","#eb7caf","#fff"]},"reconcileId":"","parallelIndex":-1}},{"key":"line_ZveWMAXWmM","source":"stn_METq0IjN7_","target":"stn_yRWB9fpCnw","attributes":{"visible":true,"zIndex":0,"type":"perpendicular","perpendicular":{"startFrom":"from","offsetFrom":0,"offsetTo":0,"roundCornerFactor":18.33},"style":"single-color","single-color":{"color":["wuhan","wh2","#eb7caf","#fff"]},"reconcileId":"","parallelIndex":-1}}]},"version":77}`;

        // ================================================================
        // 2. 解析 JSON 数据
        // ================================================================
        const data = JSON.parse(rawJson);
        const nodes = data.graph.nodes || [];
        const edges = data.graph.edges || [];

        // 构建节点索引
        const nodeMap = {};
        nodes.forEach(n => { nodeMap[n.key] = n; });

        // 提取所有站点的坐标范围（忽略虚拟节点等）
        let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
        let hasCoord = false;
        nodes.forEach(n => {
            const x = n.attributes.x;
            const y = n.attributes.y;
            if (typeof x === 'number' && typeof y === 'number') {
                hasCoord = true;
                if (x < minX) minX = x;
                if (x > maxX) maxX = x;
                if (y < minY) minY = y;
                if (y > maxY) maxY = y;
            }
        });
        if (!hasCoord) { alert('未找到有效坐标数据'); throw new Error('No coordinates'); }

        // ================================================================
        // 3. 设置 Canvas 渲染
        // ================================================================
        const container = document.getElementById('canvas-container');
        const canvas = document.createElement('canvas');
        container.appendChild(canvas);
        const ctx = canvas.getContext('2d');

        let W = window.innerWidth;
        let H = window.innerHeight;
        canvas.width = W;
        canvas.height = H;

        const pad = 60;
        const dataWidth = maxX - minX + 2 * pad;
        const dataHeight = maxY - minY + 2 * pad;
        let scale = Math.min(W / dataWidth, H / dataHeight) * 0.9;
        let offsetX = (W - dataWidth * scale) / 2 - minX * scale + pad * scale;
        let offsetY = (H - dataHeight * scale) / 2 - minY * scale + pad * scale;

        let currentScale = scale;
        let currentOffsetX = offsetX;
        let currentOffsetY = offsetY;

        // 交互状态
        let isDragging = false;
        let dragStartX = 0, dragStartY = 0;
        let dragOffX = 0, dragOffY = 0;

        const tooltip = document.getElementById('tooltip');

        function toScreen(wx, wy) {
            return { x: wx * currentScale + currentOffsetX, y: wy * currentScale + currentOffsetY };
        }

        // ================================================================
        // 4. 绘制函数
        // ================================================================
        function draw() {
            ctx.clearRect(0, 0, W, H);
            ctx.fillStyle = '#f4f6f9';
            ctx.fillRect(0, 0, W, H);

            // ---- 绘制边（线路） ----
            edges.forEach(edge => {
                const src = nodeMap[edge.source];
                const tgt = nodeMap[edge.target];
                if (!src || !tgt) return;
                const sx = src.attributes.x, sy = src.attributes.y;
                const tx = tgt.attributes.x, ty = tgt.attributes.y;
                if (sx == null || sy == null || tx == null || ty == null) return;
                const p1 = toScreen(sx, sy);
                const p2 = toScreen(tx, ty);

                let color = '#888';
                const attrs = edge.attributes;
                if (attrs.style === 'single-color' && attrs['single-color']) {
                    const c = attrs['single-color'].color;
                    if (Array.isArray(c) && c.length >= 3) color = c[2];
                } else if (attrs['bjsubway-tram']) {
                    const c = attrs['bjsubway-tram'].color;
                    if (Array.isArray(c) && c.length >= 3) color = c[2];
                } else if (attrs['mtr-light-rail']) {
                    const c = attrs['mtr-light-rail'].color;
                    if (Array.isArray(c) && c.length >= 3) color = c[2];
                } else if (attrs['chongqingrt-line-badge']) {
                    const c = attrs['chongqingrt-line-badge'].color;
                    if (Array.isArray(c) && c.length >= 3) color = c[2];
                }

                ctx.beginPath();
                ctx.moveTo(p1.x, p1.y);
                ctx.lineTo(p2.x, p2.y);
                ctx.strokeStyle = color;
                ctx.lineWidth = Math.max(2, 3 * (currentScale / scale));
                ctx.stroke();
            });

            // ---- 绘制节点（站点） ----
            nodes.forEach(node => {
                const x = node.attributes.x;
                const y = node.attributes.y;
                if (x == null || y == null) return;
                const pos = toScreen(x, y);

                let name = '';
                let isInterchange = false;
                const attrs = node.attributes;
                if (attrs['bjsubway-int']) {
                    const names = attrs['bjsubway-int'].names;
                    if (names && names.length > 0) name = names[0];
                    isInterchange = true;
                } else if (attrs['bjsubway-basic']) {
                    const names = attrs['bjsubway-basic'].names;
                    if (names && names.length > 0) name = names[0];
                } else if (attrs['suzhourt-basic']) {
                    const names = attrs['suzhourt-basic'].names;
                    if (names && names.length > 0) name = names[0];
                } else if (attrs['chongqingrt-basic']) {
                    const names = attrs['chongqingrt-basic'].names;
                    if (names && names.length > 0) name = names[0];
                }

                // 忽略无名字的辅助节点
                if (!name) return;

                const radius = isInterchange ? 8 : 5;
                const r = Math.max(radius * (currentScale / scale), 3);
                ctx.beginPath();
                ctx.arc(pos.x, pos.y, r, 0, 2 * Math.PI);
                ctx.fillStyle = isInterchange ? '#FF6B6B' : '#3B82F6';
                ctx.fill();
                if (isInterchange) {
                    ctx.strokeStyle = '#fff';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                }

                // 显示站名（缩放足够时）
                if (currentScale > 0.12) {
                    const fontSize = Math.min(14, 14 * (currentScale / scale));
                    ctx.font = `${fontSize}px system-ui, -apple-system, sans-serif`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'bottom';
                    ctx.shadowColor = 'rgba(255,255,255,0.9)';
                    ctx.shadowBlur = 4;
                    ctx.fillStyle = '#1f2937';
                    ctx.fillText(name, pos.x, pos.y - r - 4);
                    ctx.shadowBlur = 0;
                }
            });

            // 标题（左上角）
            ctx.font = '18px system-ui';
            ctx.fillStyle = '#1f2937';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'top';
            ctx.fillText('容晨轨道交通线网图', 16, 16);
        }

        function render() { draw(); }

        // ================================================================
        // 5. 交互事件
        // ================================================================
        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.clientX || (e.touches && e.touches[0].clientX);
            const clientY = e.clientY || (e.touches && e.touches[0].clientY);
            return { x: clientX - rect.left, y: clientY - rect.top };
        }

        function onPointerDown(e) {
            e.preventDefault();
            isDragging = true;
            const p = getPos(e);
            dragStartX = p.x;
            dragStartY = p.y;
            dragOffX = currentOffsetX;
            dragOffY = currentOffsetY;
            canvas.style.cursor = 'grabbing';
        }

        function onPointerMove(e) {
            e.preventDefault();
            const p = getPos(e);
            if (!p) return;

            if (isDragging) {
                const dx = p.x - dragStartX;
                const dy = p.y - dragStartY;
                currentOffsetX = dragOffX + dx;
                currentOffsetY = dragOffY + dy;
                render();
            } else {
                // 悬停检测
                const mx = p.x, my = p.y;
                let found = null;
                for (let node of nodes) {
                    const x = node.attributes.x, y = node.attributes.y;
                    if (x == null || y == null) continue;
                    const pos = toScreen(x, y);
                    const dist = Math.hypot(mx - pos.x, my - pos.y);
                    if (dist < 20) {
                        let name = '';
                        const attrs = node.attributes;
                        if (attrs['bjsubway-int']) name = attrs['bjsubway-int'].names[0] || '';
                        else if (attrs['bjsubway-basic']) name = attrs['bjsubway-basic'].names[0] || '';
                        else if (attrs['suzhourt-basic']) name = attrs['suzhourt-basic'].names[0] || '';
                        else if (attrs['chongqingrt-basic']) name = attrs['chongqingrt-basic'].names[0] || '';
                        if (name) { found = { name, x: pos.x, y: pos.y }; break; }
                    }
                }
                if (found) {
                    tooltip.style.display = 'block';
                    tooltip.innerHTML = `<div class="name">${found.name}</div>`;
                    tooltip.style.left = (found.x + 12) + 'px';
                    tooltip.style.top = (found.y - 20) + 'px';
                } else {
                    tooltip.style.display = 'none';
                }
            }
        }

        function onPointerUp(e) {
            isDragging = false;
            canvas.style.cursor = 'grab';
        }

        function onWheel(e) {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const mx = e.clientX - rect.left;
            const my = e.clientY - rect.top;
            const delta = e.deltaY > 0 ? 0.9 : 1.1;
            const newScale = currentScale * delta;
            if (newScale < 0.05 || newScale > 5) return;
            const worldX = (mx - currentOffsetX) / currentScale;
            const worldY = (my - currentOffsetY) / currentScale;
            currentScale = newScale;
            currentOffsetX = mx - worldX * currentScale;
            currentOffsetY = my - worldY * currentScale;
            render();
        }

        function resetView() {
            currentScale = scale;
            currentOffsetX = offsetX;
            currentOffsetY = offsetY;
            render();
        }

        function resizeCanvas() {
            W = window.innerWidth;
            H = window.innerHeight;
            canvas.width = W;
            canvas.height = H;
            // 重新计算初始缩放
            const newScale = Math.min(W / dataWidth, H / dataHeight) * 0.9;
            scale = newScale;
            offsetX = (W - dataWidth * scale) / 2 - minX * scale + pad * scale;
            offsetY = (H - dataHeight * scale) / 2 - minY * scale + pad * scale;
            resetView();
        }

        // ---- 绑定事件 ----
        canvas.addEventListener('mousedown', onPointerDown);
        canvas.addEventListener('mousemove', onPointerMove);
        canvas.addEventListener('mouseup', onPointerUp);
        canvas.addEventListener('mouseleave', onPointerUp);
        canvas.addEventListener('wheel', onWheel, { passive: false });

        canvas.addEventListener('touchstart', onPointerDown, { passive: false });
        canvas.addEventListener('touchmove', onPointerMove, { passive: false });
        canvas.addEventListener('touchend', onPointerUp, { passive: false });

        window.addEventListener('resize', resizeCanvas);
        window.addEventListener('keydown', (e) => {
            if (e.key === 'r' || e.key === 'R') resetView();
        });

        // ================================================================
        // 6. 启动
        // ================================================================
        canvas.style.cursor = 'grab';
        render();

        console.log('加载成功 Loading successfully');
    </script>
