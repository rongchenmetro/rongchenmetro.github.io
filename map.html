<!-- 放大弹窗 (模态框) 采用白色背景和阴影 -->
<div id="mapModal" class="fixed inset-0 z-50 flex items-center justify-center hidden" style="background-color: rgba(0,0,0,0.6); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);">
  <div class="relative max-w-[90%] max-h-[90vh] p-2 rounded-xl bg-white shadow-2xl">
    <span id="closeModalBtn" class="absolute -top-4 -right-4 w-10 h-10 flex items-center justify-center rounded-full bg-white text-gray-800 text-2xl font-bold cursor-pointer hover:bg-gray-100 transition shadow-md" style="z-index: 10;">&times;</span>
    <img src="https://daixiawunian.ct.ws/wp-content/uploads/2025/11/IMG_3855-scaled.png" 
         alt="放大线路图" 
         class="max-w-full max-h-[85vh] rounded-lg object-contain"
         style="box-shadow: 0 8px 30px rgba(0,0,0,0.3);">
  </div>
</div>

<!-- 交互脚本 -->
<script>
  (function() {
    const mapImage = document.getElementById('mapImage');
    const modal = document.getElementById('mapModal');
    const closeBtn = document.getElementById('closeModalBtn');

    if (mapImage) {
      mapImage.addEventListener('click', function(e) {
        e.stopPropagation();
        modal.classList.remove('hidden');
        modal.style.display = 'flex';
      });
    }

    function closeModal() {
      modal.classList.add('hidden');
      modal.style.display = 'none';
    }

    if (closeBtn) {
      closeBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        closeModal();
      });
    }

    modal.addEventListener('click', function(e) {
      if (e.target === modal) {
        closeModal();
      }
    });

    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape' && !modal.classList.contains('hidden')) {
        closeModal();
      }
    });

    modal.classList.add('hidden');
    modal.style.display = 'none';
  })();
</script>
